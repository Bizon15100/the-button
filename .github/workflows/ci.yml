name: Pipeline CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  actions: read          # dla github/codeql-action/upload-sarif w repo prywatnym
  contents: read         # dla actions/checkout
  security-events: write # wymagane do uploadu SARIF do Security tab

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: the-button:${{ github.sha }}
        load: true

    # 1) Skan Trivy -> SARIF (blokujący, ale raport zawsze uploadowany)
    - name: Run Trivy vulnerability scanner (SARIF, blocking)
      id: trivy
      uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b4d117d53d21edfe
      with:
        image-ref: 'the-button:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
        # blokujemy pipeline dla HIGH/CRITICAL, ale raport i tak wyślemy
        exit-code: '1'
        ignore-unfixed: true
        severity: 'HIGH,CRITICAL'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      # zawsze uploaduj, nawet jeśli Trivy zwróci exit 1
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    # 2) Test obrazu – wykona się tylko gdy skan Trivy nie zfailuje
    - name: Test Docker image
      if: success()  # nie testuj/pushuj, jeśli są blokujące podatności
      run: |
        docker run --name test-container -d -p 8000:8000 the-button:${{ github.sha }}
        for i in {1..10}; do
          if curl -s http://localhost:8000/ | grep -q "Ping"; then
            echo "Application available!"
            break
          fi
          if [ $i -eq 10 ]; then
            echo "Application test timed out"
            exit 1
          fi
          echo "Retry $i – Waiting 1 sec..."
          sleep 1
        done

    - name: Tag and push Docker image
      if: success() && github.event_name != 'pull_request'
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        docker tag the-button:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/the-button:${SHORT_SHA}
        docker tag the-button:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/the-button:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/the-button:${SHORT_SHA}
        docker push ${{ secrets.DOCKER_USERNAME }}/the-button:latest

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Create virtual environment
      if: success()
      run: python -m venv .venv

    - name: Install dependencies
      if: success()
      run: |
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/pip install -r requirements.txt

    - name: Run tests
      if: success()
      run: |
        .venv/bin/python manage.py test
